name: Auto-Scrape via Tor and Push
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * 0'
jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4

      - name: Prepare Tor Dockerfile
        run: |
          cat <<'EOF' > Dockerfile
          FROM python:slim-trixie
          RUN apt-get update && apt-get install -y tor curl netcat-openbsd unzip && apt-get clean
          RUN pip install --no-cache-dir yt-dlp scrapetube requests[socks]
          RUN mkdir -p /etc && echo "--proxy socks5://localhost:9050" > /etc/yt-dlp.conf
          RUN echo 'ExitNodes {id}\nStrictNodes 1\nSocksPort 0.0.0.0:9050' >> /etc/tor/torrc
          RUN printf '#!/bin/bash\ntor --RunAsDaemon 1 >/dev/null 2>&1\nwhile ! nc -z localhost 9050; do sleep 1; done\nsleep 3\nexec "$@"\n' > /entrypoint.sh && chmod +x /entrypoint.sh
          WORKDIR /workspace
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

      - name: Prepare Python Scraper Script
        run: |
          cat <<'PYEOF' > scrape_uu_v3.py
          import scrapetube
          import sys
          import os
          import re
          import threading
          import logging
          import time
          from datetime import datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed

          MAX_WORKERS = 4
          MAX_RETRIES = 3
          RETRY_DELAY = 5

          # Single raw output — sorting happens in the awk post-step
          # update_data.js prefix rule applies to the FINAL sorted files, not this one
          RAW_OUT      = "raw_all_scraped.txt"
          FAILED_OUT   = "failed_playlists.txt"   # yt-dlp fallback reads this
          LOG_FILE     = f"scrape_log_{datetime.now().strftime('%Y%m%d_%H%M%S')}.txt"

          raw_lock    = threading.Lock()
          failed_lock = threading.Lock()

          log = logging.getLogger("scraper")
          log.setLevel(logging.DEBUG)
          _fmt = logging.Formatter("%(asctime)s [%(levelname)s] %(message)s", datefmt="%H:%M:%S")
          _fh  = logging.FileHandler(LOG_FILE, encoding="utf-8")
          _fh.setFormatter(_fmt)
          _sh  = logging.StreamHandler(sys.stdout)
          _sh.setFormatter(_fmt)
          log.addHandler(_fh)
          log.addHandler(_sh)

          # Validation — rejects Tor log bleed lines
          _VALID_YT_RE = re.compile(
              r'^(https?://|@|UC|UU|PL)[a-zA-Z0-9@._/\-?=&%]+$'
          )
          def is_valid_target(t):
              return bool(t and len(t) >= 4 and ' ' not in t and _VALID_YT_RE.match(t))

          def log_failed(playlist_url, reason):
              """Append failed playlist URL to failed_playlists.txt for yt-dlp fallback."""
              with failed_lock:
                  with open(FAILED_OUT, "a", encoding="utf-8") as f:
                      f.write(f"{playlist_url}\n")
              log.warning(f"  QUEUED FOR YT-DLP FALLBACK: {playlist_url} ({reason})")

          def scrape_target(raw_target):
              raw_target = raw_target.strip()
              if not raw_target or not is_valid_target(raw_target):
                  log.debug(f"SKIPPED invalid: {repr(raw_target[:80])}")
                  return

              target = raw_target
              is_playlist = False
              params      = {}
              playlist_id = None

              if "list=" in target:
                  m = re.search(r'list=([a-zA-Z0-9_-]+)', target)
                  playlist_id = m.group(1) if m else target
                  is_playlist = True
                  label       = playlist_id
                  log.info(f"playlist → {playlist_id}")
              elif re.match(r'^(PL|UU)[a-zA-Z0-9_-]+$', target):
                  playlist_id = target
                  is_playlist = True
                  label       = playlist_id
                  log.info(f"playlist ID → {playlist_id}")
              elif "youtube.com/" in target or "youtu.be/" in target:
                  params = {"channel_url": target}
                  label  = target.rstrip("/").split("/")[-1]
                  log.info(f"channel URL → {target}")
              elif target.startswith("@"):
                  params = {"channel_url": f"https://www.youtube.com/{target}"}
                  label  = target
                  log.info(f"handle → {target}")
              else:
                  params = {"channel_id": target}
                  label  = target
                  log.info(f"channel ID → {target}")

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      if is_playlist:
                          videos = scrapetube.get_playlist(playlist_id)
                      else:
                          videos = scrapetube.get_channel(**params, content_type="videos")

                      lines = []
                      count = 0

                      for video in videos:
                          try:
                              title = ""
                              if 'title' in video:
                                  if 'runs' in video['title']:
                                      title = video['title']['runs'][0]['text']
                                  elif 'simpleText' in video['title']:
                                      title = video['title']['simpleText']
                              video_id = video.get('videoId')
                              if not video_id or not title:
                                  continue
                              url = f"https://www.youtube.com/watch?v={video_id}"
                              lines.append(f"{title}\n{url}\n\n")
                              count += 1
                              if count % 50 == 0:
                                  log.info(f"  [{label}] {count} videos so far...")
                          except Exception as e:
                              log.debug(f"  [{label}] per-video error: {e}")
                              continue

                      if count == 0:
                          # 0 videos = private, region-locked, or empty playlist
                          # Send to yt-dlp fallback which handles region differently
                          url_for_fallback = (
                              f"https://www.youtube.com/playlist?list={playlist_id}"
                              if is_playlist else target
                          )
                          log_failed(url_for_fallback, "0 videos from scrapetube")
                          return

                      block = "".join(lines)
                      with raw_lock:
                          with open(RAW_OUT, "a", encoding="utf-8") as f:
                              f.write(block)

                      log.info(f"  [{label}] DONE: {count} videos → {RAW_OUT} (attempt={attempt})")
                      return

                  except Exception as e:
                      err_str = str(e)

                      # continuationCommand = scrapetube pagination bug, not retriable
                      # yt-dlp handles this playlist type correctly
                      if "continuationCommand" in err_str:
                          url_for_fallback = (
                              f"https://www.youtube.com/playlist?list={playlist_id}"
                              if is_playlist else target
                          )
                          log_failed(url_for_fallback, f"scrapetube continuationCommand bug")
                          return

                      # Connection errors are retriable
                      is_conn = any(k in err_str for k in [
                          "RemoteDisconnected", "ConnectionError",
                          "ConnectionAborted",  "Connection aborted",
                          "JSONDecodeError",
                      ])
                      if is_conn and attempt < MAX_RETRIES:
                          log.warning(
                              f"  [{label}] connection drop attempt {attempt}/{MAX_RETRIES}"
                              f" — retry in {RETRY_DELAY}s"
                          )
                          time.sleep(RETRY_DELAY)
                      else:
                          url_for_fallback = (
                              f"https://www.youtube.com/playlist?list={playlist_id}"
                              if is_playlist else target
                          )
                          log_failed(url_for_fallback, f"FAILED after {attempt} attempts: {err_str[:60]}")
                          log.error(f"  [{label}] FAILED after {attempt} attempt(s): {e}", exc_info=True)
                          return


          if __name__ == "__main__":
              default_targets = [
                  "UCUn0hEbVJc273anl_0ozDMQ",
                  "UCC-g5hWSvCbdB8HQQIA0_pg",
                  "UCqyqBNOAlZgJ3dQoDSCbCjQ",
                  "UCxxnxya_32jcKj4yN1_kD7A",
                  "UCcYw1UUwxjIMYfvmdQrcyUA",
                  "UCrcQMdsFqYpZOHDbm-fnNlw",
                  "UCqX5I4e5iTpAt3tMYZJzZTQ",
                  "UC0wNSTMWIL3qaorLx0jie6A"
              ]

              targets = []
              raw_args = sys.argv[1:] if len(sys.argv) > 1 else default_targets
              for item in raw_args:
                  if os.path.isfile(item):
                      with open(item, 'r', encoding='utf-8') as f:
                          targets.extend(line.strip() for line in f if line.strip())
                  else:
                      targets.append(item)

              raw_count = len(targets)
              targets = [t for t in targets if t.strip() and is_valid_target(t)]
              dropped  = raw_count - len(targets)

              log.info(f"ALL_PROXY = {os.environ.get('ALL_PROXY', 'NOT SET — bypasses Tor!')}")
              log.info(f"Loaded {raw_count} → {len(targets)} valid ({dropped} dropped)")
              log.info(f"Workers: {MAX_WORKERS} | Retries: {MAX_RETRIES} | Log: {LOG_FILE}")

              open(RAW_OUT,  "w").close()
              open(FAILED_OUT, "w").close()

              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
                  futures = {executor.submit(scrape_target, t): t for t in targets}
                  for future in as_completed(futures):
                      try:
                          future.result()
                      except Exception as e:
                          log.error(f"Unhandled thread exception: {e}", exc_info=True)

              total_raw = sum(1 for l in open(RAW_OUT, encoding='utf-8') if l.startswith('http'))
              failed_count = sum(1 for l in open(FAILED_OUT, encoding='utf-8') if l.strip())
              log.info("═" * 60)
              log.info(f"RAW RESULT  {RAW_OUT}  →  {total_raw} URLs")
              log.info(f"QUEUED FOR YT-DLP FALLBACK  →  {failed_count} playlists")
              log.info(f"LOG FILE: {LOG_FILE}")
              log.info("═" * 60)
          PYEOF

      - name: Build Scraper Image
        run: docker build -t media-scraper .

      - name: Phase 1 — Extract Playlist URLs via yt-dlp
        run: |
          CHANNELS=(
            "https://www.youtube.com/channel/UCUn0hEbVJc273anl_0ozDMQ/playlists"
            "https://www.youtube.com/channel/UCC-g5hWSvCbdB8HQQIA0_pg/playlists"
            "https://www.youtube.com/channel/UCqyqBNOAlZgJ3dQoDSCbCjQ/playlists"
            "https://www.youtube.com/@MuseIndonesia/playlists"
            "https://www.youtube.com/channel/UCcYw1UUwxjIMYfvmdQrcyUA/playlists"
            "https://www.youtube.com/channel/UCrcQMdsFqYpZOHDbm-fnNlw/playlists"
            "https://www.youtube.com/channel/UCqX5I4e5iTpAt3tMYZJzZTQ/playlists"
            "https://www.youtube.com/channel/UC0wNSTMWIL3qaorLx0jie6A/playlists"
          )
          touch all_playlists.txt
          for CHANNEL in "${CHANNELS[@]}"; do
            echo "Grabbing playlists for $CHANNEL ..."
            docker run --rm \
              -v ${{ github.workspace }}:/workspace \
              media-scraper \
              yt-dlp --flat-playlist --print "%(url)s" "$CHANNEL" 2>/dev/null \
              | awk 'NF && /youtube\.com/' >> all_playlists.txt
          done
          echo "=== all_playlists.txt: $(wc -l < all_playlists.txt) entries ==="
          head -5 all_playlists.txt

      - name: Phase 2 — Bulk Scrape via scrapetube
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e ALL_PROXY=socks5h://127.0.0.1:9050 \
            -e HTTPS_PROXY=socks5h://127.0.0.1:9050 \
            -e HTTP_PROXY=socks5h://127.0.0.1:9050 \
            media-scraper \
            python scrape_uu_v3.py all_playlists.txt

          echo "=== raw_all_scraped.txt: $(grep -c '^https' raw_all_scraped.txt 2>/dev/null || echo 0) URLs ==="
          echo "=== failed_playlists.txt: $(wc -l < failed_playlists.txt 2>/dev/null || echo 0) playlists ==="

      - name: Phase 3 — yt-dlp Fallback for Failed Playlists
        run: |
          if [ ! -s failed_playlists.txt ]; then
            echo "No failed playlists — skipping yt-dlp fallback"
            exit 0
          fi

          FAIL_COUNT=$(wc -l < failed_playlists.txt)
          echo "Running yt-dlp fallback for $FAIL_COUNT playlists..."

          while IFS= read -r playlist_url || [ -n "$playlist_url" ]; do
            [ -z "$playlist_url" ] && continue
            echo "  yt-dlp fallback: $playlist_url"
            docker run --rm \
              -v ${{ github.workspace }}:/workspace \
              media-scraper \
              yt-dlp \
                --flat-playlist \
                --print "%(title)s" \
                --print "%(webpage_url)s" \
                --print "" \
                --no-warnings \
                --quiet \
                "$playlist_url" 2>/dev/null >> raw_all_scraped.txt || \
              echo "  [WARN] yt-dlp also failed for $playlist_url"
          done < failed_playlists.txt

          echo "=== After fallback: $(grep -c '^https' raw_all_scraped.txt 2>/dev/null || echo 0) total URLs ==="

      - name: Phase 4 — Sort into filtered files via awk
        run: |
          # awk paragraph mode (RS="") reads each title+url block as one record
          # Matches "Ani-One Indonesia" (with or without hyphen, case-insensitive via tolower)
          # → filtered_channel_anioneid.txt
          # Everything else → filtered_combined_all.txt
          awk '
            BEGIN { RS=""; ORS="\n\n" }
            {
              if (tolower($0) ~ /ani.?one indonesia/) {
                print > "filtered_channel_anioneid.txt"
              } else {
                print > "filtered_combined_all.txt"
              }
            }
          ' raw_all_scraped.txt

          echo "=== Sort results ==="
          echo "filtered_channel_anioneid.txt : $(grep -c '^https' filtered_channel_anioneid.txt 2>/dev/null || echo 0) URLs"
          echo "filtered_combined_all.txt     : $(grep -c '^https' filtered_combined_all.txt 2>/dev/null || echo 0) URLs"
          echo ""
          echo "=== AniOne ID sample (first 6 lines) ==="
          head -6 filtered_channel_anioneid.txt 2>/dev/null || echo "(empty — check raw_all_scraped.txt for Ani-One Indonesia titles)"
          echo ""
          echo "=== Log summary ==="
          cat scrape_log_*.txt 2>/dev/null \
            | grep -E "(RESULT|FAILED|FALLBACK|dropped|continuationCommand|═)" \
            || echo "No log found"
