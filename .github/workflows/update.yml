name: Auto-Scrape via Tor and Push
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * 0'
jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4

      - name: Prepare Tor Dockerfile
        run: |
          cat <<'EOF' > Dockerfile
          FROM python:slim-trixie
          RUN apt-get update && apt-get install -y tor curl netcat-openbsd unzip && apt-get clean
          RUN pip install --no-cache-dir yt-dlp scrapetube requests[socks]
          RUN mkdir -p /etc && echo "--proxy socks5://localhost:9050" > /etc/yt-dlp.conf
          RUN echo 'ExitNodes {id}\nStrictNodes 1\nSocksPort 0.0.0.0:9050' >> /etc/tor/torrc
          # FIX #1a: redirect ALL Tor output to /dev/null in the entrypoint
          # so it never bleeds into pipes that capture stdout
          RUN printf '#!/bin/bash\ntor --RunAsDaemon 1 >/dev/null 2>&1\nwhile ! nc -z localhost 9050; do sleep 1; done\nsleep 3\nexec "$@"\n' > /entrypoint.sh && chmod +x /entrypoint.sh
          WORKDIR /workspace
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

      - name: Prepare Python Scraper Script
        run: |
          cat <<'PYEOF' > scrape_uu_v3.py
          import scrapetube
          import sys
          import os
          import re
          import threading
          import logging
          import time
          from datetime import datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed

          MAX_WORKERS = 4
          MAX_RETRIES = 3
          RETRY_DELAY = 5  # seconds between retries on connection errors

          # update_data.js: /^filtered.*\.txt$/i — prefix mandatory
          OUT_ANIONE = "filtered_channel_anioneid.txt"
          OUT_OTHERS = "filtered_combined_all.txt"
          LOG_FILE   = f"scrape_log_{datetime.now().strftime('%Y%m%d_%H%M%S')}.txt"

          lock_anione = threading.Lock()
          lock_others = threading.Lock()

          log = logging.getLogger("scraper")
          log.setLevel(logging.DEBUG)
          _fmt = logging.Formatter("%(asctime)s [%(levelname)s] %(message)s", datefmt="%H:%M:%S")
          _fh = logging.FileHandler(LOG_FILE, encoding="utf-8")
          _fh.setFormatter(_fmt)
          _sh = logging.StreamHandler(sys.stdout)
          _sh.setFormatter(_fmt)
          log.addHandler(_fh)
          log.addHandler(_sh)

          ANI_ONE_CHANNEL_MARKERS = [
              "UCUn0hEbVJc273anl_0ozDMQ",
              "UUUn0hEbVJc273anl_0ozDMQ",
              "AniOneID",
          ]
          _ANIONE_TITLE_RE = re.compile(r'Ani[-\s]?One\s+Indonesia', re.IGNORECASE)

          # FIX #3: strict validation — only accept real YouTube targets
          # Rejects anything that looks like a log line (spaces, brackets, colons)
          _VALID_YT_RE = re.compile(
              r'^(https?://|@|UC|UU|PL)[a-zA-Z0-9@._/\-?=&%]+$'
          )

          def is_valid_target(t):
              if not t or len(t) < 4:
                  return False
              if not _VALID_YT_RE.match(t):
                  return False
              # Reject anything with spaces (log lines always have spaces)
              if ' ' in t:
                  return False
              return True

          def is_anione_channel(tag):
              if not tag:
                  return False
              return any(m in tag for m in ANI_ONE_CHANNEL_MARKERS)

          def is_anione_title(title):
              return bool(_ANIONE_TITLE_RE.search(title))

          def scrape_target(raw_target):
              raw_target = raw_target.strip()
              if not raw_target:
                  return

              source_chan = None
              target = raw_target
              if "|||" in raw_target:
                  source_chan, target = raw_target.split("|||", 1)
                  target = target.strip()

              # FIX #3: validate BEFORE doing anything with the target
              if not is_valid_target(target):
                  log.debug(f"SKIPPED invalid target (likely Tor log line): {repr(target[:80])}")
                  return

              route_anione = is_anione_channel(source_chan)

              is_playlist = False
              params      = {}
              playlist_id = None

              if "list=" in target:
                  m = re.search(r'list=([a-zA-Z0-9_-]+)', target)
                  playlist_id  = m.group(1) if m else target
                  is_playlist  = True
                  label        = playlist_id
                  log.info(f"[{source_chan or '?'}] playlist → {playlist_id}")
              elif re.match(r'^(PL|UU)[a-zA-Z0-9_-]+$', target):
                  playlist_id  = target
                  is_playlist  = True
                  label        = playlist_id
                  log.info(f"[{source_chan or '?'}] playlist ID → {playlist_id}")
              elif "youtube.com/" in target or "youtu.be/" in target:
                  params = {"channel_url": target}
                  label  = target.split("/")[-1]
                  log.info(f"[{source_chan or '?'}] channel URL → {target}")
              elif target.startswith("@"):  # FIX #2: removed erroneous space
                  params = {"channel_url": f"https://www.youtube.com/{target}"}
                  label  = target
                  log.info(f"[{source_chan or '?'}] handle → {target}")
              else:
                  params = {"channel_id": target}
                  label  = target
                  log.info(f"[{source_chan or '?'}] channel ID → {target}")

              # FIX #4: retry loop for Tor connection drops
              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      if is_playlist:
                          videos = scrapetube.get_playlist(playlist_id)
                      else:
                          videos = scrapetube.get_channel(**params, content_type="videos")

                      lines        = []
                      count        = 0
                      title_checks = 0

                      for video in videos:
                          try:
                              title = ""
                              if 'title' in video:
                                  if 'runs' in video['title']:
                                      title = video['title']['runs'][0]['text']
                                  elif 'simpleText' in video['title']:
                                      title = video['title']['simpleText']

                              video_id = video.get('videoId')
                              if not video_id:
                                  log.debug(f"  [{label}] skip: no videoId — {str(video)[:80]}")
                                  continue
                              if not title:
                                  log.debug(f"  [{label}] skip: no title for {video_id}")
                                  continue

                              # Title-based override (first 5 videos)
                              if title_checks < 5:
                                  if is_anione_title(title):
                                      if not route_anione:
                                          log.warning(
                                              f"  [{label}] TITLE OVERRIDE: "
                                              f"'Ani-One Indonesia' found in title, "
                                              f"chan_tag='{source_chan}' → rerouting to {OUT_ANIONE}"
                                          )
                                      route_anione = True
                                  title_checks += 1

                              url = f"https://www.youtube.com/watch?v={video_id}"
                              lines.append(f"{title}\n{url}\n\n")
                              count += 1
                              if count % 50 == 0:
                                  log.info(f"  [{label}] {count} videos so far...")
                          except Exception as e:
                              log.debug(f"  [{label}] per-video error: {e}")
                              continue

                      if count == 0:
                          log.warning(
                              f"  [{label}] 0 videos — private/deleted/region-locked? "
                              f"(chan={source_chan}, attempt={attempt})"
                          )
                          return

                      out_file = OUT_ANIONE if route_anione else OUT_OTHERS
                      lock     = lock_anione if route_anione else lock_others
                      block    = "".join(lines)
                      with lock:
                          with open(out_file, "a", encoding="utf-8") as f:
                              f.write(block)

                      log.info(
                          f"  [{label}] DONE: {count} videos → {out_file} "
                          f"(anione={route_anione}, attempt={attempt})"
                      )
                      return  # success — exit retry loop

                  except Exception as e:
                      err_str = str(e)
                      is_conn_err = any(k in err_str for k in [
                          "RemoteDisconnected", "ConnectionError",
                          "ConnectionAborted", "Connection aborted"
                      ])
                      if is_conn_err and attempt < MAX_RETRIES:
                          log.warning(
                              f"  [{label}] connection drop (attempt {attempt}/{MAX_RETRIES}), "
                              f"retrying in {RETRY_DELAY}s..."
                          )
                          time.sleep(RETRY_DELAY)
                          continue
                      else:
                          log.error(
                              f"  [{label}] FAILED after {attempt} attempt(s): {e}",
                              exc_info=True
                          )
                          return


          if __name__ == "__main__":
              default_targets = [
                  "UCUn0hEbVJc273anl_0ozDMQ",
                  "UCC-g5hWSvCbdB8HQQIA0_pg",
                  "UCqyqBNOAlZgJ3dQoDSCbCjQ",
                  "UCxxnxya_32jcKj4yN1_kD7A",
                  "UCcYw1UUwxjIMYfvmdQrcyUA",
                  "UCrcQMdsFqYpZOHDbm-fnNlw",
                  "UCqX5I4e5iTpAt3tMYZJzZTQ",
                  "UC0wNSTMWIL3qaorLx0jie6A"
              ]

              targets = []
              raw_args = sys.argv[1:] if len(sys.argv) > 1 else default_targets

              for item in raw_args:
                  if os.path.isfile(item):
                      with open(item, 'r', encoding='utf-8') as f:
                          targets.extend(line.strip() for line in f if line.strip())
                  else:
                      targets.append(item)

              # FIX #3: filter invalid targets at load time too, log how many dropped
              raw_count = len(targets)
              targets = [t for t in targets if t.strip() and is_valid_target(
                  t.split("|||", 1)[1].strip() if "|||" in t else t
              )]
              dropped = raw_count - len(targets)

              log.info(f"ALL_PROXY = {os.environ.get('ALL_PROXY', 'NOT SET — bypasses Tor!')}")
              log.info(
                  f"Loaded {raw_count} lines → {len(targets)} valid targets "
                  f"({dropped} dropped as invalid/log lines)"
              )
              log.info(f"Workers: {MAX_WORKERS} | Retries: {MAX_RETRIES} | Log: {LOG_FILE}")

              open(OUT_ANIONE, "w").close()
              open(OUT_OTHERS, "w").close()

              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
                  futures = {executor.submit(scrape_target, t): t for t in targets}
                  for future in as_completed(futures):
                      try:
                          future.result()
                      except Exception as e:
                          log.error(f"Unhandled thread exception: {e}", exc_info=True)

              anione_urls = sum(1 for l in open(OUT_ANIONE, encoding='utf-8') if l.startswith('http'))
              others_urls = sum(1 for l in open(OUT_OTHERS, encoding='utf-8') if l.startswith('http'))

              log.info("═" * 60)
              log.info(f"RESULT  {OUT_ANIONE}  →  {anione_urls} URLs")
              log.info(f"RESULT  {OUT_OTHERS}  →  {others_urls} URLs")
              log.info(f"LOG FILE: {LOG_FILE}")
              log.info("═" * 60)
          PYEOF

      - name: Build Scraper Image
        run: docker build -t media-scraper .

      - name: Extract Playlists using yt-dlp inside Docker
        run: |
          CHANNELS=(
            "UCUn0hEbVJc273anl_0ozDMQ|https://www.youtube.com/channel/UCUn0hEbVJc273anl_0ozDMQ/playlists"
            "UCC-g5hWSvCbdB8HQQIA0_pg|https://www.youtube.com/channel/UCC-g5hWSvCbdB8HQQIA0_pg/playlists"
            "UCqyqBNOAlZgJ3dQoDSCbCjQ|https://www.youtube.com/channel/UCqyqBNOAlZgJ3dQoDSCbCjQ/playlists"
            "UCxxnxya_32jcKj4yN1_kD7A|https://www.youtube.com/@MuseIndonesia/playlists"
            "UCcYw1UUwxjIMYfvmdQrcyUA|https://www.youtube.com/channel/UCcYw1UUwxjIMYfvmdQrcyUA/playlists"
            "UCrcQMdsFqYpZOHDbm-fnNlw|https://www.youtube.com/channel/UCrcQMdsFqYpZOHDbm-fnNlw/playlists"
            "UCqX5I4e5iTpAt3tMYZJzZTQ|https://www.youtube.com/channel/UCqX5I4e5iTpAt3tMYZJzZTQ/playlists"
            "UC0wNSTMWIL3qaorLx0jie6A|https://www.youtube.com/channel/UC0wNSTMWIL3qaorLx0jie6A/playlists"
          )

          touch all_playlists.txt

          for ENTRY in "${CHANNELS[@]}"; do
            CHAN_ID="${ENTRY%%|*}"
            CHAN_URL="${ENTRY#*|}"
            echo "Grabbing playlists for $CHAN_ID ..."
            # FIX #1b: 2>/dev/null suppresses any container stderr (Tor notices)
            # that survive despite the entrypoint redirect — belt and suspenders
            docker run --rm \
              -v ${{ github.workspace }}:/workspace \
              media-scraper \
              yt-dlp --flat-playlist --print "%(url)s" "$CHAN_URL" 2>/dev/null \
              | awk -v id="$CHAN_ID" 'NF && /youtube\.com/{print id "|||" $0}' >> all_playlists.txt
          done

          echo "=== all_playlists.txt preview (first 10 lines) ==="
          head -10 all_playlists.txt
          echo "=== Total playlist entries ==="
          wc -l all_playlists.txt

      - name: Run scrape_uu_v3.py inside Docker (PySocks via ALL_PROXY)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e ALL_PROXY=socks5h://127.0.0.1:9050 \
            -e HTTPS_PROXY=socks5h://127.0.0.1:9050 \
            -e HTTP_PROXY=socks5h://127.0.0.1:9050 \
            media-scraper \
            python scrape_uu_v3.py all_playlists.txt

      - name: Sanity check outputs
        run: |
          echo "=== filtered_channel_anioneid.txt ==="
          wc -l filtered_channel_anioneid.txt 2>/dev/null || echo "MISSING"
          echo "=== filtered_combined_all.txt ==="
          wc -l filtered_combined_all.txt      2>/dev/null || echo "MISSING"
          echo ""
          echo "=== AniOne ID sample (first 6 lines) ==="
          head -6 filtered_channel_anioneid.txt 2>/dev/null || echo "(empty)"
          echo ""
          echo "=== Log summary ==="
          cat scrape_log_*.txt 2>/dev/null \
            | grep -E "(RESULT|FAILED|OVERRIDE|dropped|0 videos|retrying)" \
            || echo "No log found"
