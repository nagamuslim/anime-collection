          echo "=== Static files injected ==="
          echo "filtered_static_jade.txt   : $(grep -c '^https' filtered_static_jade.txt) URLs (78 Jade Dynasty eps)"
          echo "filtered_static_itsanime.txt: $(grep -c '^https' filtered_static_itsanime.txt) URLs (9 It's Anime series)"
 
      # ── Phase 5: Download offline DB once, shared by update_data.js,
      # metadata.js --phase1, and patch_metadata.py so we only fetch ~60MB once.
      # update_data.js checks for anime-offline-database-minified.json in
      # __dirname before falling back to GitHub download.
      - name: Phase 5 — Download offline DB (shared)
        run: |
          echo "Downloading anime-offline-database-minified.json..."
          curl -L --retry 3 --progress-bar \
            "https://github.com/manami-project/anime-offline-database/releases/latest/download/anime-offline-database-minified.json" \
            -o anime-offline-database-minified.json
          echo "DB downloaded: $(du -sh anime-offline-database-minified.json | cut -f1)"
 
      # ── Phase 5b: update_data.js reads ALL filtered*.txt in its directory
      # (which is $GITHUB_WORKSPACE after checkout). That includes:
      #   filtered_channel_anioneid.txt   (Phase 4)
      #   filtered_combined_all.txt       (Phase 4)
      #   filtered_static_jade.txt        (Phase 4b)
      #   filtered_static_itsanime.txt    (Phase 4b)
      # It merges with the existing anime_data.json from the checkout,
      # then auto-loads metadata.js as MAL resolver (uses local offline DB).
      - name: Phase 5b — Build anime_data.json via update_data.js
        run: |
          node update_data.js
          echo "=== anime_data.json results ==="
          node -e "
            const d = JSON.parse(require('fs').readFileSync('anime_data.json','utf8'));
            const eps = d.anime_list.reduce((s, a) => s + a.episode_count, 0);
            console.log('Series  :', d.total_series);
            console.log('Episodes:', eps);
            console.log('Updated :', d.last_updated);
          "
 
      # ── Phase 5c: jq is pre-installed on ubuntu-latest (jq 1.7+).
      # Patches is_donghua for series the parsers can't auto-detect:
      #   - Jade Dynasty: from It's Anime channel (no is_donghua flag in parseItsAnime)
      #   - Penguasa Misteri: confirmed Chinese animation
      # Add more | contains("...") clauses here as needed.
      - name: Phase 5c — Fix is_donghua flags via jq
        run: |
          jq '.anime_list |= map(
            if (.name | (contains("Jade Dynasty") or contains("Penguasa Misteri")))
            then .is_donghua = true
            else .
            end
          )' anime_data.json > anime_data.json.tmp && mv anime_data.json.tmp anime_data.json
          echo "is_donghua patch applied"
          node -e "
            const d = JSON.parse(require('fs').readFileSync('anime_data.json','utf8'));
            const donghua = d.anime_list.filter(a => a.is_donghua).map(a => a.name);
            console.log('Donghua titles (' + donghua.length + '):', donghua.slice(0, 10).join(', ') + (donghua.length > 10 ? '...' : ''));
          "
 
      # ── Phase 5d: metadata.js --phase1 reads anime_data.json (from Phase 5b)
      # and anime-offline-database-minified.json (from Phase 5). Writes
      # metadata.json with { malId, tags, allTitles, score } per anime.
      # Python 3.x and Node.js are both pre-installed on ubuntu-latest.
      - name: Phase 5d — Build metadata.json via metadata.js --phase1
        run: |
          node metadata.js --phase1
          echo "=== metadata.json results ==="
          node -e "
            const m = JSON.parse(require('fs').readFileSync('metadata.json','utf8'));
            const keys  = Object.keys(m).filter(k => k.startsWith('meta_'));
            const found = keys.filter(k => !m[k].not_found).length;
            const nf    = keys.filter(k =>  m[k].not_found).length;
            console.log('Matched   :', found);
            console.log('Not found :', nf);
            console.log('Total     :', keys.length);
            console.log('Accuracy  :', (found / keys.length * 100).toFixed(1) + '%');
          "
 
      # ── Phase 5e: patch_metadata.py must be committed to the repo.
      # It reads anime-offline-database-minified.json as its first argument
      # (avoids a second 60MB download) and patches metadata.json in-place
      # with manually verified MAL IDs that metadata.js --phase1 missed.
      - name: Phase 5e — Patch metadata.json with verified MAL IDs
        run: |
          cat anime-offline-database-minified.json | python3 patch_metadata.py && sudo ls 
 
      # ── Artifacts: upload all useful outputs for manual download.
      # retention-days: 5 keeps storage usage low (GH default is 90 days).
      # if: always() ensures files upload even when a prior step fails,
      # so you always have the scrape logs for debugging.
      # upload-artifact@v4 silently skips any paths that don't exist
      # (e.g. metadata.json won't exist if Phase 5d fails).
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results-${{ github.run_number }}
          retention-days: 5
          path: |
            filtered_channel_anioneid.txt
            filtered_combined_all.txt
            failed_playlists.txt
            scrape_log.txt
            anime_data.json
            metadata.json
 
