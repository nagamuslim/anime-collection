          - 04:19:09 Episode 19
          - 04:33:58 Episode 20
          - 04:48:55 Episode 21
          - 05:04:07 Episode 22
          - 05:20:12 Episode 23
          - 05:35:45 Episode 24
          - 05:52:32 Episode 25
          - 06:08:58 Episode 26
          - 06:32:34 Episode 27
          - 06:48:10 Episode 28
