<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Tontonan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }

        .header { background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); padding: 15px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
        .back-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: all 0.3s ease; white-space: nowrap; }
        .back-btn:hover { background: rgba(255,255,255,0.2); transform: translateX(-3px); }
        .page-title { font-size: 1.5em; font-weight: 600; color: white; flex: 1; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .clear-btn { background: rgba(220,50,50,0.15); border: 1px solid rgba(220,50,50,0.3); color: #ff8a80; padding: 8px 16px; border-radius: 8px; font-size: 0.82em; font-weight: 600; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; }
        .clear-btn:hover { background: rgba(220,50,50,0.28); }

        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

        .anime-card { background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; transition: transform 0.3s ease, box-shadow 0.3s ease; border: 1px solid rgba(255,255,255,0.1); display: block; text-decoration: none; color: inherit; position: relative; }
        .anime-card:hover { transform: translateY(-8px); box-shadow: 0 15px 40px rgba(0,0,0,0.6); border-color: rgba(102,126,234,0.5); }

        /* Remove-from-history button */
        .remove-btn { position: absolute; top: 10px; left: 10px; width: 28px; height: 28px; background: rgba(0,0,0,0.6); color: #aaa; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); cursor: pointer; z-index: 20; display: flex; align-items: center; justify-content: center; font-size: 0.75em; font-weight: bold; transition: all 0.2s ease; }
        .remove-btn:hover { background: rgba(220,50,50,0.75); color: white; border-color: transparent; transform: scale(1.1); }

        .thumbnail { position: relative; width: 100%; padding-top: 56.25%; overflow: hidden; }
        .thumb-img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:block; }
        .thumb-fallback { position: absolute; top:0; left:0; width:100%; height:100%; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .anime-icon { font-size: 4em; opacity: 0.9; }

        /* "Terakhir ditonton" badge */
        .badge-last { position: absolute; bottom: 8px; right: 8px; padding: 3px 8px; border-radius: 5px; font-size: 0.72em; font-weight: 600; color: white; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.15); white-space: nowrap; }

        .info { padding: 14px 16px 16px; }
        .title { color: #fff; font-size: 1.05em; font-weight: 600; margin-bottom: 10px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 3em; }

        /* Progress / stats box */
        .progress-box { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 5px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.82em; color: #aaa; }
        .stat-val { color: #a8e6cf; font-weight: 600; }
        .stat-val.ep { color: #c3b1e1; }

        /* "Lanjutkan" button inside card */
        .resume-btn { display: block; margin-top: 12px; padding: 9px; border-radius: 8px; text-align: center; font-size: 0.83em; font-weight: 700; color: white; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); text-decoration: none; transition: opacity 0.2s; }
        .resume-btn:hover { opacity: 0.82; }

        .loading { text-align: center; padding: 60px; color: #b0b0b0; font-size: 1.2em; grid-column: 1 / -1; }
        .no-results { text-align: center; padding: 60px; color: #888; grid-column: 1 / -1; }
        .no-results-icon { font-size: 4em; margin-bottom: 16px; opacity: 0.5; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
            .header-content { flex-wrap: wrap; }
        }

        /* ── MAL Sync Bar ──────────────────────────────────────────── */
        .mal-bar{max-width:1400px;margin:0 auto 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:12px;padding:12px 18px;}
        .mal-status-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
        .mal-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.2);flex-shrink:0;display:none;}
        .mal-dot{width:8px;height:8px;border-radius:50%;background:#666;flex-shrink:0;transition:background .3s;}
        .mal-dot.ok{background:#6bcf7f;box-shadow:0 0 6px rgba(107,207,127,.6);}
        #mal-status-text{font-size:0.86em;color:#b0b0b0;font-weight:600;}
        #mal-last-sync{font-size:0.78em;color:#777;}
        .mal-hdr-btns{margin-left:auto;display:flex;gap:8px;flex-shrink:0;}
        .mal-btn-sm{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#ccc;padding:5px 12px;border-radius:7px;font-size:0.78em;font-family:inherit;cursor:pointer;transition:background .2s;white-space:nowrap;}
        .mal-btn-sm:hover{background:rgba(255,255,255,0.14);}
        .mal-btn-sync{color:#a8e6cf;border-color:rgba(168,230,175,.3);}
        .mal-btn-sync:hover{background:rgba(168,230,175,.1);}
        .mal-btn-disc{color:#ff8a80;border-color:rgba(220,50,50,.25);}
        .mal-btn-disc:hover{background:rgba(220,50,50,.12);}
        #mal-panel{margin-top:14px;border-top:1px solid rgba(255,255,255,0.07);padding-top:14px;}
        .mal-fields{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
        .mal-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:170px;}
        .mal-field label{font-size:0.76em;color:#888;}
        .mal-field input{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.12);color:#e0e0e0;border-radius:8px;padding:8px 11px;font-size:0.86em;font-family:inherit;width:100%;}
        .mal-field input:focus{outline:none;border-color:rgba(102,126,234,.5);}
        .mal-options-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
        .mal-check-label{display:flex;align-items:center;gap:7px;font-size:0.84em;color:#ccc;cursor:pointer;}
        .mal-check-label input[type=checkbox]{accent-color:#667eea;width:14px;height:14px;cursor:pointer;}
        .mal-check-hint{color:#777;font-size:0.82em;}
        .mal-adv-btn{background:none;border:none;color:#667eea;font-size:0.78em;cursor:pointer;padding:0;font-family:inherit;}
        .mal-adv-btn:hover{color:#a8e6cf;}
        #mal-adv-section{margin-top:8px;}
        #mal-paste-row{display:flex;gap:8px;align-items:flex-end;margin-top:10px;}
        #mal-paste-row .mal-field{flex:1;}
        .mal-action-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;}
        .mal-btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border:none;color:#fff;padding:9px 20px;border-radius:8px;font-size:0.86em;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .2s;}
        .mal-btn-primary:hover{opacity:.85;}
        #mal-code-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;background:rgba(102,126,234,.08);border:1px solid rgba(102,126,234,.25);border-radius:8px;padding:9px 13px;}
        #mal-code-val{color:#a8e6cf;font-family:monospace;font-size:0.82em;flex:1;word-break:break-all;line-height:1.5;}
        #mal-copy-btn,#mal-paste-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#ccc;padding:5px 10px;border-radius:6px;font-size:0.78em;font-family:inherit;cursor:pointer;white-space:nowrap;}
        #mal-copy-btn:hover,#mal-paste-btn:hover{background:rgba(255,255,255,.15);}
        #mal-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(30,20,60,0.95);border:1px solid rgba(255,255,255,0.15);color:#e0e0e0;padding:8px 18px;border-radius:20px;font-size:0.84em;opacity:0;pointer-events:none;transition:all .25s;z-index:9999;white-space:nowrap;}
        #mal-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <a href="index.html" class="back-btn">&#8592; Beranda</a>
            <div class="page-title">&#128250; Riwayat Tontonan</div>
            <button class="clear-btn" id="clearAllBtn">&#128465; Hapus Semua</button>
        </div>
    </div>


    <!-- MAL Sync Bar -->
    <div class="container" style="padding-bottom:0;padding-top:20px">
      <div class="mal-bar" id="mal-bar">
        <div class="mal-status-row">
          <img class="mal-avatar" id="mal-avatar" src="" alt="avatar"/>
          <span class="mal-dot" id="mal-dot"></span>
          <span id="mal-status-text">MAL: Belum terhubung</span>
          <span id="mal-last-sync"></span>
          <div class="mal-hdr-btns">
            <button class="mal-btn-sm mal-btn-sync" id="mal-sync-btn" style="display:none">Sinkron Sekarang ↺</button>
            <button class="mal-btn-sm" id="mal-toggle-btn">Hubungkan ▾</button>
            <button class="mal-btn-sm mal-btn-disc" id="mal-disconnect-btn" style="display:none">Putuskan</button>
          </div>
        </div>

        <div id="mal-panel" style="display:none">
          <div class="mal-fields">
            <div class="mal-field">
              <label>Client ID</label>
              <input type="text" id="mal-cid" placeholder="MAL Client ID" autocomplete="off"/>
            </div>
            <div class="mal-field">
              <label>Client Secret</label>
              <input type="password" id="mal-csec" placeholder="MAL Client Secret" autocomplete="off"/>
            </div>
          </div>
          <div class="mal-options-row">
            <label class="mal-check-label">
              <input type="checkbox" id="mal-auto-cb"/>
              <span>Auto mode <span class="mal-check-hint">(tanpa tempel kode manual)</span></span>
            </label>
            <button class="mal-adv-btn" id="mal-adv-btn">⚙ Advanced</button>
          </div>
          <div id="mal-adv-section" style="display:none">
            <div class="mal-fields">
              <div class="mal-field" style="min-width:100%">
                <label>GAS Web App URL (opsional — sudah ada default)</label>
                <input type="url" id="mal-gas-url" placeholder="https://script.google.com/macros/s/.../exec"/>
              </div>
            </div>
          </div>
          <div id="mal-paste-row" style="display:none">
            <div class="mal-field">
              <label>Kode Otorisasi (dari halaman GAS)</label>
              <input type="text" id="mal-auth-code" placeholder="Tempel kode di sini..."/>
            </div>
            <button class="mal-btn-primary" id="mal-exchange-btn">Tukar →</button>
          </div>
          <div id="mal-code-box" style="display:none">
            <div id="mal-code-val"></div>
            <button id="mal-copy-btn">Salin</button>
            <button id="mal-paste-btn">Tempel ke field →</button>
          </div>
          <div class="mal-action-row">
            <button class="mal-btn-primary" id="mal-connect-btn">Hubungkan MAL ↗</button>
          </div>
        </div>
      </div>
    </div>
    <div id="mal-toast"></div>
    <div class="container">
        <div class="grid" id="historyGrid">
            <div class="loading">&#9203; Memuat riwayat...</div>
        </div>
    </div>

    <script src="metadata.js" onerror="void 0"></script>
    <script src="bookmark.js" onerror="void 0"></script>
    <script>
        'use strict';

        // For thumbnail lookups we need the master anime data
        let animeDataMap = new Map();

        const icons  = ['🎭','⚔️','⭐','🔥','💧','⚡','🎯','🌸','🎪','🎨','🎵','🎮','🌙','☀️','🎁'];
        const colors = ['#ff6b6b','#4ecdc4','#ffe66d','#a8e6cf','#ffd93d','#6bcf7f','#95e1d3','#f38181','#aa96da','#fcbad3'];

        function hashStr(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
            return Math.abs(h);
        }

        function timeAgo(ts) {
            if (!ts) return '-';
            const diff = Date.now() - ts;
            const m = Math.floor(diff / 60000);
            if (m < 1)  return 'Baru saja';
            if (m < 60) return m + ' menit lalu';
            const h = Math.floor(m / 60);
            if (h < 24) return h + ' jam lalu';
            const d = Math.floor(h / 24);
            if (d < 7)  return d + ' hari lalu';
            return new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function removeEntry(e, animeName) {
            e.preventDefault();
            e.stopPropagation();
            if (typeof BookmarkManager === 'undefined') return;
            BookmarkManager.clearEntry(animeName);
            renderHistory();
        }

        function createCard(entry) {
            const name     = entry.name;
            const animeObj = animeDataMap.get(name);
            const thumbId  = animeObj ? animeObj.thumbnail_video_id : null;
            const hqUrl    = thumbId ? 'https://img.youtube.com/vi/' + thumbId + '/hqdefault.jpg' : null;
            const mqUrl    = thumbId ? 'https://img.youtube.com/vi/' + thumbId + '/mqdefault.jpg' : null;

            const h     = hashStr(name);
            const icon  = icons[h % icons.length];
            const color = colors[h % colors.length];

            const epNum   = entry.lastWatchedEpisodeNumber;
            const epTitle = entry.lastWatchedEpisodeTitle || (epNum ? 'Episode ' + epNum : null);
            const visits  = entry.visitCount || 1;

            // Player URL — link to the episode they stopped at if known
            const savedTime = entry.lastWatchedTime && entry.lastWatchedTime > 5 ? entry.lastWatchedTime : null;
            const playerUrl = 'player.html?anime=' + encodeURIComponent(name) +
                              (epNum ? '&episode=' + epNum : '') +
                              (savedTime ? '&time=' + savedTime : '');

            // Card is a <div> not an <a> so the remove button doesn't bubble
            const card = document.createElement('div');
            card.className = 'anime-card';
            card.style.cursor = 'pointer';

            const lastSeenBadge = entry.lastWatchedAt
                ? '<div class="badge-last">' + timeAgo(entry.lastWatchedAt) + '</div>'
                : '';

            card.innerHTML =
                '<button class="remove-btn" title="Hapus dari riwayat">&#10005;</button>' +
                '<div class="thumbnail">' +
                (hqUrl
                    ? '<img class="thumb-img" src="' + hqUrl + '" alt="' + name.replace(/"/g,'&quot;') + '"' +
                      ' onerror="this.src=\'' + mqUrl + '\';this.onerror=function(){this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';}"/>'
                    : '') +
                '<div class="thumb-fallback" style="background:linear-gradient(135deg,' + color + '33 0%,' + color + '66 100%);' + (hqUrl ? '' : 'display:flex;') + '">' +
                '<div class="anime-icon">' + icon + '</div></div>' +
                lastSeenBadge +
                '</div>' +
                '<div class="info">' +
                  '<div class="title">' + name + '</div>' +
                  '<div class="progress-box">' +
                    (epTitle
                        ? '<div class="stat-row"><span>Terakhir ditonton</span><span class="stat-val ep">' + epTitle + '</span></div>'
                        : '') +
                    '<div class="stat-row"><span>Episode dibuka</span><span class="stat-val">' + visits + 'x</span></div>' +
                  '</div>' +
                  '<a href="' + playerUrl + '" class="resume-btn">&#9654; Lanjutkan Menonton</a>' +
                '</div>';

            // Clicking anywhere on the card (except the remove button) → player
            card.addEventListener('click', function (e) {
                if (e.target.closest('.remove-btn')) return;
                window.location.href = playerUrl;
            });

            card.querySelector('.remove-btn').addEventListener('click', function (e) {
                removeEntry(e, name);
            });

            return card;
        }

        function renderHistory() {
            const grid = document.getElementById('historyGrid');

            if (typeof BookmarkManager === 'undefined') {
                grid.innerHTML = '<div class="no-results"><div class="no-results-icon">&#128274;</div>' +
                    '<h2>BookmarkManager tidak tersedia</h2>' +
                    '<p>Pastikan bookmark.js ada di direktori yang sama.</p></div>';
                return;
            }

            const history = BookmarkManager.getWatchHistory();

            if (history.length === 0) {
                grid.innerHTML = '<div class="no-results"><div class="no-results-icon">&#128250;</div>' +
                    '<h2>Belum Ada Riwayat</h2>' +
                    '<p>Buka anime dan putar episode untuk mulai melacak tontonanmu.</p></div>';
                return;
            }

            grid.innerHTML = '';
            history.forEach(entry => grid.appendChild(createCard(entry)));
        }

        async function loadMasterData() {
            // Try to load thumbnail / episode-count info from master data.
            // Failure here is non-fatal — cards still render without thumbnails.
            try {
                let data = null;
                const raw = localStorage.getItem('anime_data');
                if (raw) data = JSON.parse(raw);
                if (!data) data = await (await fetch('anime_data.json')).json();
                if (data && data.anime_list) {
                    data.anime_list.forEach(a => animeDataMap.set(a.name, a));
                }
            } catch (e) {
                // silent — thumbnails won't load but everything else works
            }

            renderHistory();
        }

        document.getElementById('clearAllBtn').addEventListener('click', function () {
            if (typeof BookmarkManager === 'undefined') return;
            const history = BookmarkManager.getWatchHistory();
            if (history.length === 0) return;
            if (confirm('Hapus seluruh riwayat tontonan (' + history.length + ' anime)?\nData ini tidak bisa dikembalikan.')) {
                BookmarkManager.clearAll();
                renderHistory();
            }
        });

        loadMasterData();
    </script>

    <script>
    // ── Embedded MAL Guide ────────────────────────────────────────────
    // Stored inline so no extra file is needed in the repo.

    // GAS_CODE is defined here (outside getGuideHtml) so it can be:
    //  1. Downloaded via downloadGas()
    //  2. Copied to clipboard via copyGasCode()
    //  3. Displayed in the audit code block inside the guide
    //  4. Injected into the standalone new-tab version via JSON.stringify
    var GAS_CODE = `/**
 * MAL GAS Proxy — 2-mode OAuth
 *
 * doGet has TWO modes, selected by the state parameter:
 *
 * MODE 1 — DISPLAY (default, state has no ":poll" suffix)
 *   GAS shows the code prominently on screen with a Copy button.
 *   User copies it manually and pastes into the tester.
 *   Zero server storage. Works for any number of concurrent users.
 *   State format: "NONCE" (plain, no colon-poll)
 *
 * MODE 2 — POLL (state ends with ":SESSIONID:poll")
 *   GAS stores code in CacheService keyed by sessionId.
 *   Tester polls every 2s via CHECK_CODE action.
 *   Fully hands-free after clicking Allow.
 *   State format: "NONCE:SESSIONID:poll"
 */

function doGet(e) {
  var params   = e.parameter || {};
  var code     = params.code;
  var error    = params.error;
  var rawState = params.state || '';

  if (!code && !error) {
    return HtmlService.createHtmlOutput(
      '<p style="font-family:monospace;padding:20px">MAL GAS Proxy running. Send POST requests.</p>'
    );
  }
  if (error) {
    return HtmlService.createHtmlOutput(
      '<p style="font-family:monospace;padding:20px;color:red">OAuth error: ' + error + '</p>'
    );
  }

  // Parse state to determine mode
  // Poll mode state: "NONCE:SESSIONID:poll"
  // Display mode state: anything else
  var parts = rawState.split(':');
  var isPollMode = parts.length >= 3 && parts[parts.length - 1] === 'poll';
  var sessionId  = isPollMode ? parts[parts.length - 2] : null;

  if (isPollMode && sessionId) {
    // ── POLL MODE ────────────────────────────────────────────────────────
    // Store in CacheService for 120 seconds — tester will poll for it
    CacheService.getScriptCache().put('mal_code_' + sessionId, code, 120);

    return HtmlService.createHtmlOutput(
      buildPage(
        '✓', '#39d98a',
        'Authorized!',
        'Code stored in GAS Cache.<br>The tester page is polling and will pick it up automatically.<br>You can close this tab.',
        null // no code to display
      )
    );
  } else {
    // ── DISPLAY MODE ─────────────────────────────────────────────────────
    // Show code prominently — user copies it manually
    // Trusted Types is enforced so we build the HTML carefully
    return HtmlService.createHtmlOutput(buildPage(
      '✓', '#39d98a',
      'Authorized! Copy your code:',
      'Copy the code below and paste it into the tester, then click Exchange.',
      code
    ));
  }
}

function buildPage(icon, iconColor, title, subtitle, code) {
  var codeSection = '';
  if (code) {
    codeSection =
      '<div style="background:#0a0a0d;border:2px solid #39d98a;border-radius:10px;padding:16px;margin:16px 0;max-width:600px;width:100%;">'
      + '<div style="font-size:11px;color:#6b6b80;margin-bottom:8px;font-family:monospace">Authorization Code — copy all of it:</div>'
      + '<div id="codeVal" style="font-family:monospace;font-size:12px;color:#39d98a;word-break:break-all;line-height:1.6;">' + code + '</div>'
      + '</div>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">'
      + '<button onclick="copyCode()" style="background:#39d98a;color:#000;border:none;border-radius:8px;padding:10px 22px;font-family:monospace;font-size:13px;font-weight:bold;cursor:pointer;">📋 Copy Code</button>'
      + '</div>'
      + '<script>'
      + 'function copyCode(){'
      + 'var t=document.getElementById("codeVal").textContent;'
      + 'if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){document.querySelector("button").textContent="✅ Copied!";});}'
      + 'else{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);document.querySelector("button").textContent="✅ Copied!";}'
      + '}'
      + '<\/script>';
  }

// ── Token exchange ─────────────────────────────────────────────────────────
function exchangeToken_(params) {
  var qs = Object.keys(params)
    .map(function(k){ return encodeURIComponent(k)+\'=\'+encodeURIComponent(params[k]); })
    .join(\'&\');
  var res = UrlFetchApp.fetch(\'https://myanimelist.net/v1/oauth2/token\', {
    method:\'post\',
    headers:{\'Content-Type\':\'application/x-www-form-urlencoded\'},
    payload:qs, muteHttpExceptions:true
  });
  try { return JSON.parse(res.getContentText()); }
  catch(e){ return { error:\'parse_failed\', raw:res.getContentText() }; }
}

// ── List API ───────────────────────────────────────────────────────────────
class MalApi {
  constructor(token) {
    if (!token) throw new Error(\'Token required\');
    this.base = \'https://api.myanimelist.net/v2\';
    this.tok  = token;
    this.fields = [
      \'id\',\'title\',\'main_picture\',\'alternative_titles\',
      \'start_date\',\'end_date\',\'synopsis\',\'mean\',\'rank\',
      \'popularity\',\'num_list_users\',\'num_scoring_users\',\'nsfw\',
      \'genres\',\'created_at\',\'updated_at\',\'media_type\',\'status\',
      \'my_list_status\',\'num_episodes\',\'start_season\',\'broadcast\',
      \'source\',\'average_episode_duration\',\'rating\',\'studios\',
      \'score\',\'num_watched_episodes\',\'is_rewatching\',
      \'finish_date\',\'priority\',\'num_times_rewatched\',\'rewatch_value\',\'tags\'
    ];
  }
  _qs(p){return Object.keys(p).filter(k=>p[k]!==undefined&&p[k]!==null&&p[k]!==\'\').map(k=>encodeURIComponent(k)+\'=\'+encodeURIComponent(p[k])).join(\'&\');}
  _ok(r){try{return JSON.parse(r.getContentText());}catch(e){return{message:\'ok (empty body)\'}; }}
  auth(){return{Authorization:\'Bearer \'+this.tok};}
  
  // --- TAMBAHAN BARU: Fungsi Ambil Profil ---
  getProfile() {
    return this._ok(UrlFetchApp.fetch(this.base + \'/users/@me\', {
      method: \'get\',
      headers: this.auth(),
      muteHttpExceptions: true
    }));
  }

  getList(user,offset,limit){
    user=user||\'@me\'; offset=(offset!==undefined&&offset!==null)?Number(offset):0; limit=limit?Number(limit):100;
    return this._ok(UrlFetchApp.fetch(this.base+\'/users/\'+user+\'/animelist?\'+this._qs({fields:this.fields.join(\',\'),offset,limit}),{method:\'get\',headers:this.auth(),muteHttpExceptions:true}));
  }
  updateList(id,data){return this._ok(UrlFetchApp.fetch(this.base+\'/anime/\'+id+\'/my_list_status\',{method:\'put\',headers:Object.assign(this.auth(),{\'Content-Type\':\'application/x-www-form-urlencoded\'}),payload:this._qs(data),muteHttpExceptions:true}));}
  deleteList(id){return this._ok(UrlFetchApp.fetch(this.base+\'/anime/\'+id+\'/my_list_status\',{method:\'delete\',headers:this.auth(),muteHttpExceptions:true}));}
}

// ── doPost ─────────────────────────────────────────────────────────────────
function doPost(e) {
  try {
    var req=JSON.parse(e.postData.contents), result;
    if(req.action===\'CHECK_CODE\'){
      var cache=CacheService.getScriptCache(), key=\'mal_code_\'+req.sessionId, code=cache.get(key);
      if(code){cache.remove(key);result={code:code,found:true};}else{result={found:false};}
    }
    // --- TAMBAHAN BARU: Handler GET_PROFILE ---
    else if(req.action===\'GET_ME\') { 
      result = new MalApi(req.token).getProfile(); 
    }
    else if(req.action===\'GET\'){result=new MalApi(req.token).getList(req.userName,req.offset,req.limit);}
    else if(req.action===\'UPDATE\'){result=new MalApi(req.token).updateList(req.animeId,req.updateData);}
    else if(req.action===\'DELETE\'){result=new MalApi(req.token).deleteList(req.animeId);}
    else if(req.action===\'GET_TOKEN\'){result=exchangeToken_({client_id:req.clientId,client_secret:req.clientSecret,code:req.code,code_verifier:req.codeVerifier,grant_type:\'authorization_code\',redirect_uri:req.redirectUri});}
    else if(req.action===\'REFRESH_TOKEN\'){result=exchangeToken_({client_id:req.clientId,client_secret:req.clientSecret,refresh_token:req.refreshToken,grant_type:\'refresh_token\'});}
    else throw new Error(\'Unknown action: \'+req.action);
    return ContentService.createTextOutput(JSON.stringify({success:true,data:result})).setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({success:false,error:err.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
}

<script>
// GAS_CODE is injected from the parent page's JS variable via JSON.stringify
var GAS_CODE = \${injectedGasCode};

// Populate code block when page loads
document.addEventListener('DOMContentLoaded', function() {
    var pre = document.getElementById('gas-code-pre');
    if (pre) pre.textContent = GAS_CODE;
});

function copyText(elId, btn) {
    var text = document.getElementById(elId).textContent.trim();
    var orig = btn.textContent;
    function onSuccess() { btn.textContent = '✅ Disalin!'; btn.classList.add('copied'); setTimeout(function(){ btn.textContent = orig; btn.classList.remove('copied'); }, 2200); }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(onSuccess).catch(fallback); } else { fallback(); }
    function fallback() { try { var ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); onSuccess(); } catch(e) { btn.textContent = '⚠ Salin manual'; setTimeout(function(){ btn.textContent = orig; }, 2500); } }
}

function copyGasCode(btn) {
    var orig = btn.textContent;
    function onSuccess() { btn.textContent = '✅ Disalin!'; setTimeout(function(){ btn.textContent = orig; }, 2200); }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(GAS_CODE).then(onSuccess).catch(fallback); } else { fallback(); }
    function fallback() { try { var ta = document.createElement('textarea'); ta.value = GAS_CODE; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); onSuccess(); } catch(e) { btn.textContent = '⚠ Salin manual'; setTimeout(function(){ btn.textContent = orig; }, 2500); } }
}

function downloadGas() {
    try {
        var blob = new Blob([GAS_CODE], { type: 'text/plain' });
        var url  = URL.createObjectURL(blob);
        var a    = document.createElement('a');
        a.href = url; a.download = 'gas-proxy.gs';
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    } catch(e) {
        alert('Download gagal — gunakan tombol Salin ke Clipboard lalu tempel ke editor teks.');
    }
}
<\/script>

    <script>
    (function malBarInit(){
        if(typeof MALSync==='undefined') return;

        // ── Pre-fill saved values ─────────────────────────────────────
        function ck(n){var m=document.cookie.match('(?:^|; )'+n+'=([^;]*)');return m?decodeURIComponent(m[1]):'';}
        var cid=ck('mal_cid')||localStorage.getItem('cid')||'';
        var gasUrl=ck('mal_gas')||localStorage.getItem('gas_url')||'';
        var elCid=document.getElementById('mal-cid'),elGas=document.getElementById('mal-gas-url');
        if(elCid&&cid) elCid.value=cid;
        if(elGas&&gasUrl) elGas.value=gasUrl;
        // Show Advanced only if GAS URL not set (first-time setup)
        if(!gasUrl){var adv=document.getElementById('mal-adv-section');if(adv)adv.style.display='';}

        // ── Toggle panel ──────────────────────────────────────────────
        document.getElementById('mal-toggle-btn').addEventListener('click',function(){
            var panel=document.getElementById('mal-panel');
            var syncBtn=document.getElementById('mal-sync-btn');
            var open=panel.style.display!=='none';
            panel.style.display=open?'none':'';
            if(!open&&syncBtn) syncBtn.style.display='none'; // hide sync btn while panel open
        });

        // ── Disconnect ────────────────────────────────────────────────
        document.getElementById('mal-disconnect-btn').addEventListener('click',function(){
            if(confirm('Putuskan koneksi MAL?')) MALSync.disconnect();
        });

        // ── Sync now button ───────────────────────────────────────────
        var syncBtn=document.getElementById('mal-sync-btn');
        if(syncBtn) syncBtn.addEventListener('click',function(){ MALSync.importFromMAL(); });

        // ── Advanced toggle ───────────────────────────────────────────
        document.getElementById('mal-adv-btn').addEventListener('click',function(){
            var sec=document.getElementById('mal-adv-section');
            sec.style.display=sec.style.display==='none'?'':'none';
        });

        // ── Auto mode: show/hide paste row ────────────────────────────
        document.getElementById('mal-auto-cb').addEventListener('change',function(){
            var pr=document.getElementById('mal-paste-row');
            if(pr) pr.style.display='none';
        });

        // ── Connect button ────────────────────────────────────────────
        document.getElementById('mal-connect-btn').addEventListener('click',function(){
            MALSync.startAuth();
        });

        // ── Exchange button (display mode) ────────────────────────────
        document.getElementById('mal-exchange-btn').addEventListener('click',function(){
            var code=(document.getElementById('mal-auth-code')?.value||'').trim();
            if(!code){MALSync.showToast('Tempel kode terlebih dahulu');return;}
            MALSync.exchangeCode(code);
        });

        // ── Code copy / paste ─────────────────────────────────────────
        document.getElementById('mal-copy-btn').addEventListener('click',function(){
            var v=document.getElementById('mal-code-val').textContent;
            navigator.clipboard.writeText(v).then(function(){MALSync.showToast('Disalin');});
        });
        document.getElementById('mal-paste-btn').addEventListener('click',function(){
            var v=document.getElementById('mal-code-val').textContent;
            var f=document.getElementById('mal-auth-code');
            if(f){f.value=v;var pr=document.getElementById('mal-paste-row');if(pr)pr.style.display='flex';}
        });

        // ── Render status + show sync button when connected ───────────
        MALSync.updateSyncStatus();
        var connected=MALSync.isConnected();
        if(connected){
            var sb=document.getElementById('mal-sync-btn');
            if(sb) sb.style.display='';
            // Auto-import in background (silent)
            MALSync.importFromMAL();
        }
    })();
    </script>
